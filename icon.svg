<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo negro -->
  <rect width="512" height="512" rx="100" fill="#0a0a0a"/>
  <!-- Rayos del sol -->
  <g stroke="#2ecc71" stroke-width="18" stroke-linecap="round">
    <line x1="256" y1="60" x2="256" y2="110"/>
    <line x1="256" y1="402" x2="256" y2="452"/>
    <line x1="60" y1="256" x2="110" y2="256"/>
    <line x1="402" y1="256" x2="452" y2="256"/>
    <line x1="113" y1="113" x2="148" y2="148"/>
    <line x1="364" y1="364" x2="399" y2="399"/>
    <line x1="399" y1="113" x2="364" y2="148"/>
    <line x1="148" y1="364" x2="113" y2="399"/>
  </g>
  <!-- Círculo exterior -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#2ecc71" stroke-width="8" opacity="0.4"/>
  <!-- Sol círculo principal -->
  <circle cx="256" cy="256" r="85" fill="#2ecc71"/>
  <!-- Letra K de KOAJ -->
  <text x="256" y="300" font-family="Arial Black, sans-serif" font-size="90" font-weight="900" fill="#0a0a0a" text-anchor="middle">K</text>
</svg>
